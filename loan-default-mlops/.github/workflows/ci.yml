name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install httpx

    - name: Check syntax and imports
      run: |
        python -m py_compile src/*.py api/*.py

    - name: Test API Startup
      run: |
        # Simply testing if the app can be imported without errors
        python -c "from api.app import app"
        echo "API syntax and imports are clean."
